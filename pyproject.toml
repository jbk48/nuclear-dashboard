[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nuclear-dashboard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "pandas",
    "plotly",
    "openpyxl",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["model*", "dashboard*"]
